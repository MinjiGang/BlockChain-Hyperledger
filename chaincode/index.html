<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>IoT Blockchain Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>IoT Blockchain Manager</h1>

    <div class="box">
        <h2>System Status</h2>

        <button id="status">
            상태 확인
        </button>
    </div>


    <div class="box">
        <h2>Fabric Network</h2>

        <button id="start">
            전체 시작
        </button>

        <button id="stop">
            전체 종료
        </button>
    </div>


    <div class="box">
        <h2>Gateway Server</h2>

        <button id="gatewayStart">
            Gateway 시작
        </button>

        <button id="gatewayStop">
            Gateway 종료
        </button>
    </div>


    <div class="box">
        <h2>Console</h2>

        <pre id="console">Ready</pre>
    </div>


    <script src="renderer.js"></script>

</body>

</html>
